<!DOCTYPE html>
<html lang="es" class="verificando">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#101b36"><title>Reservar un libro · Biblioteca Invaluable"><link rel="stylesheet" href="css/alumno.css"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></head>
<body>
<header class="mobile-top"><a class="brand" href="crear-pedido.html"><span class="brand-mark">▤</span><span><strong>BIBLIOTECA</strong><small>INVALUABLE · EEST N.º 5</small></span></a><nav class="mobile-nav"><a class="active" href="crear-pedido.html">Catálogo</a><a href="historial-pedidos.html">Mis pedidos</a><button type="button" data-cerrar-sesion-alumno>Salir</button></nav></header>
<main class="mobile-container">
 <section class="page-intro"><p class="eyebrow">Área de alumnos</p><h1>¿Qué te gustaría leer?</h1><p>Hola, <strong data-nombre-alumno>alumno</strong>. Buscá un libro del catálogo y enviá tu solicitud de reserva.</p></section>
 <div id="estadoCuenta" aria-live="polite"></div>
 <section class="card"><div class="section-row"><h2>Catálogo de libros</h2><small id="cantidadLibros">Cargando…</small></div><div class="catalog-search"><input class="search-input" id="buscarLibro" type="search" placeholder="Buscar título, autor o categoría…" aria-label="Buscar libros"></div><div id="catalogoLibros" class="book-list"><div class="empty-state">Cargando catálogo…</div></div></section>
 <section class="card order-form hidden" id="panelReserva"><h2>Confirmá tu solicitud</h2><p class="card-subtitle">El pedido quedará pendiente hasta que la biblioteca confirme la entrega.</p><div id="resumenLibro" class="message info"></div>
  <form id="formReserva"><input type="hidden" id="libroId" name="libro_id"><div class="field"><label for="cantidad">Cantidad de ejemplares</label><select id="cantidad" name="cantidad" required><option value="1">1 ejemplar</option></select></div><div class="field"><label for="fechaDevolucion">Fecha estimada de devolución</label><input type="date" id="fechaDevolucion" name="fecha_devolucion_estimada" required><small style="color:var(--muted);font-size:11px">La fecha es estimada; la biblioteca puede indicarte otra al entregar el libro.</small></div><div id="mensajeReserva" aria-live="polite"></div><div class="button-row"><button class="btn primary" type="submit" id="btnEnviarReserva">Enviar solicitud</button><button class="btn" type="button" id="cancelarReserva">Cancelar</button></div></form>
 </section>
 <p class="footnote">Tu reserva queda registrada en el sistema. La entrega se confirma en la biblioteca.</p>
</main><script type="module" src="js/sesion.js"></script><script type="module" src="js/crear-pedido.js"></script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script></body></html>
